# 基础文件使用生产配置，本地开发由 docker-compose.override.yml 覆盖。
# build 用于显式构建生产镜像；接入镜像仓库后使用 pull 和 up --no-build。
services:
#  app:
#    build:
#      context: ./app
#      target: runner
#    image: ${APP_IMAGE:-classwayx-app-prod}
#    container_name: classwayx-app-prod-container
#    ports:
#      - "3000:3000"
#    restart: always
#    depends_on:
#      db-init:
#        condition: service_completed_successfully

  db-init:
    image: ${POSTGRES_IMAGE:-postgres:17.10-alpine3.24}
    container_name: classwayx-db-init
    environment:
      LARK_BOT_USER: ${LARK_BOT_USER}
      LARK_BOT_USER_PASSWORD: ${LARK_BOT_USER_PASSWORD}
      LARK_BOT_DB_NAME: ${LARK_BOT_DB_NAME}
      AUTH_USER: ${AUTH_USER:?}
      AUTH_USER_PASSWORD: ${AUTH_USER_PASSWORD:?}
      AUTH_DB_NAME: ${AUTH_DB_NAME:?}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      PGPASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db_init.sql:/app/db_init.sql
    command:
      - sh
      - -ec
      - >-
        exec psql --set ON_ERROR_STOP=1
        --set lark_bot_db="$$LARK_BOT_DB_NAME"
        --set lark_bot_user="$$LARK_BOT_USER"
        --set lark_bot_user_password="$$LARK_BOT_USER_PASSWORD"
        --set auth_db="$$AUTH_DB_NAME"
        --set auth_user="$$AUTH_USER"
        --set auth_user_password="$$AUTH_USER_PASSWORD"
        -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f /app/db_init.sql

  lark-bot-db-migration:
    build:
      context: ./lark-bot
      target: migrator
    image: ${LARK_BOT_MIGRATION_IMAGE:-lark-bot-db-migration}
    container_name: lark-bot-db-migration-container
    env_file:
      - ./lark-bot/.env
    command: npx prisma migrate deploy
    restart: "no"
    depends_on:
      db-init:
        condition: service_completed_successfully

  lark-bot:
    build:
      context: ./lark-bot
      target: runner
    image: ${LARK_BOT_IMAGE:-classwayx-lark-bot-prod}
    container_name: classwayx-lark-bot-prod-container
    ports:
      - "6701:3000"
    env_file:
      - ./lark-bot/.env
    environment:
      DATABASE_URL: ""
    restart: always
    depends_on:
      lark-bot-db-migration:
        condition: service_completed_successfully

  auth-db-migration:
    build:
      context: ./auth
      target: migrator
    image: ${AUTH_MIGRATION_IMAGE:-classwayx-auth-migration}
    env_file:
      - ./auth/.env
    environment:
      BETTER_AUTH_SECRET: ""
      AUTH_USER_DATABASE_URL: ""
    restart: "no"
    depends_on:
      db-init:
        condition: service_completed_successfully

  auth:
    build:
      context: ./auth
      target: runner
    image: ${AUTH_IMAGE:-classwayx-auth-prod}
    ports:
      - "6702:3000"
    env_file:
      - ./auth/.env
    environment:
      DATABASE_URL: ""
    restart: always
    depends_on:
      auth-db-migration:
        condition: service_completed_successfully

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.10-alpine3.24}
    container_name: classwayx-postgres-container
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - classwayx-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 1s

volumes:
  classwayx-pgdata:
